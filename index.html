    body {

      display: flex;

      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 500;
      transition: 0.2s ease;
    }
    a:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

      font-size: 0.9rem;
      color: #94a3b8;
